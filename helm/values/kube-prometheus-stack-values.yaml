# helm/values/kube-prometheus-stack-values.yaml
# kube-prometheus-stack — complete monitoring stack config
# Chart: https://github.com/prometheus-community/helm-charts

# ─── PROMETHEUS ──────────────────────────────────────────────────────────────
prometheus:
  enabled: true

  prometheusSpec:
    # How long to retain metrics data
    retention: 7d

    # Storage for Prometheus data
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

    # Watch ALL ServiceMonitors and PodMonitors across all namespaces
    # Without this, Prometheus only picks up monitors in its own namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}

    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  # Expose Prometheus UI via NodePort
  service:
    type: NodePort
    nodePort: 30090

# ─── ALERTMANAGER ────────────────────────────────────────────────────────────
alertmanager:
  enabled: true

  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"

    # ─── REFERENCE SECRET HERE — no plain password in Git ──────────────────
    alertmanagerConfigSecret: alertmanager-email-secret

  service:
    type: NodePort
    nodePort: 30093

  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'kirankumatkar217@gmail.com'
      smtp_auth_username: 'kirankumatkar217@gmail.com'
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-email-secret/smtp_password
      smtp_require_tls: true

    route:
      group_by: ['namespace', 'alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'email-alerts'
      routes:
        - matchers:
            - severity="critical"
          receiver: 'email-alerts'
          group_wait: 10s
          repeat_interval: 1h
        - matchers:
            - severity="warning"
          receiver: 'email-alerts'
          group_wait: 30s
          repeat_interval: 4h
        - matchers:
            - alertname="Watchdog"
          receiver: 'null'

    receivers:
      - name: 'null'
      - name: 'email-alerts'
        email_configs:
          - to: 'kirankumatkar217@gmail.com'
            send_resolved: true
            headers:
              subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} - {{ .GroupLabels.namespace }}'

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['namespace', 'alertname']
        
# ─── GRAFANA ─────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "gitops@123"    # Change this in production

  # Expose Grafana UI via NodePort
  service:
    type: NodePort
    nodePort: 32000

  # Pre-load these default dashboards
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Asia/Kolkata

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

  # Additional Grafana plugins
  plugins:
    - grafana-piechart-panel

  # Extra dashboards to import from grafana.com by ID
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: 'Kubernetes'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      # Kubernetes cluster overview
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus

      # Node exporter full
      node-exporter:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

      # ArgoCD dashboard
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus

      # Pod resource usage
      pod-resources:
        gnetId: 6417
        revision: 1
        datasource: Prometheus

# ─── KUBE STATE METRICS ──────────────────────────────────────────────────────
# Exposes Kubernetes object metrics (pod status, deployment replicas, etc.)
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

# ─── NODE EXPORTER ───────────────────────────────────────────────────────────
# Exposes host-level metrics (CPU, memory, disk, network per node)
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"

# ─── BUILT-IN ALERTING RULES ─────────────────────────────────────────────────
# kube-prometheus-stack ships with production-grade alert rules out of the box
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false              # KIND does not expose etcd metrics
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlas: true
    kubeControllerManager: false   # Not exposed in KIND
    kubelet: true
    kubeProxy: false               # Not exposed in KIND
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false   # Not exposed in KIND
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# ─── COMPONENT EXPOSURE (KIND specific) ──────────────────────────────────────
# Some components are not accessible in KIND — disable scraping to avoid errors
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false